name: Kamu Personel Rehberi - 2 Saatlik Otomatik Tarama ve Canlı Güncelleme

on:
  schedule:
    # Türkiye Saatiyle günde 3 kez (Sabah 09:00, Öğlen 14:00, Akşam 19:00 TSI -> UTC 6, 11, 16)
    # Supabase Free plan veri kotasını korumak için optimize edildi
    - cron: '0 6,11,16 * * *'
  workflow_dispatch: # Elle tetiklemeye izin verir

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install beautifulsoup4 requests lxml feedparser Pillow pytz

      - name: Kaynak Siteleri Tara (İlanlar, Otonom AI Haber Merkezi & SSG)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.lxffirosgbrfptnbjvdg:BedirXaaN.04@aws-0-eu-west-1.pooler.supabase.com:6543/postgres' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lxffirosgbrfptnbjvdg.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_VHW7Sg89AM9NV6DqOHLTzQ_BMO4BBV9' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "=== 1. Resmi Haberleri Tarama ==="
          python scrapers/official_news.py || true
          echo "=== 2. Kamu İlanlarını Tarama ==="
          python scrapers/manager.py || true
          echo "=== 3. Web Sitesi Verilerini Dışa Aktarma ==="
          python scripts/export_website_data.py || true
          echo "=== 4. 5 Ajanlı Otonom AI Haber & Görsel Pipeline ==="
          python modules/editorial_pipeline.py || true
          echo "=== 5. Çok Sayfalı Statik Site (SSG) & Temiz Sitemap Üretimi ==="
          python scripts/ssg_builder.py || true
          echo "=== 6. Patron Paneli NVIDIA AI Yönetici Brifingi ==="
          python modules/patron_ai_briefing.py || true

      - name: Değişiklikleri GitHub Pages & Repoya Pushla
        run: |
          git config --global user.name "KamuBot AutoSync"
          git config --global user.email "bot@kamupersonelrehberi.com"
          git add website/ docs/ data/
          if git diff --staged --quiet; then
            echo "Yeni ilan veya haber bulunamadı, değişiklik yok."
          else
            git commit -m "bot: otomatik kaynak taraması, otonom haber merkezi ve SSG güncellemesi [skip ci]"
            git push origin main
          fi
