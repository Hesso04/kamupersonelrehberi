name: Kamu Personel Rehberi - Otonom Ajan Tarama ve Yayın Merkezi

on:
  schedule:
    # Türkiye Saatiyle günde 3 kez (Sabah 09:00, Öğlen 14:00, Akşam 19:00 TSİ -> UTC 6, 11, 16)
    - cron: '0 6,11,16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Çalışma Modu'
        required: true
        default: 'full_sync'
        type: choice
        options:
          - full_sync
          - editorial_only
          - rebuild_covers
          - custom_article
          - briefing_only
      custom_topic:
        description: 'Özel Makale Konusu / Başlığı (sadece custom_article modunda)'
        required: false
        default: ''
        type: string
      custom_category:
        description: 'Özel Makale Kategorisi'
        required: false
        default: 'RESMI_HABER'
        type: string

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install beautifulsoup4 requests lxml feedparser Pillow pytz

      - name: Otonom Ajanları Çalıştır (Mode -> ${{ github.event.inputs.mode || 'full_sync' }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.lxffirosgbrfptnbjvdg:BedirXaaN.04@aws-0-eu-west-1.pooler.supabase.com:6543/postgres' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://lxffirosgbrfptnbjvdg.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_VHW7Sg89AM9NV6DqOHLTzQ_BMO4BBV9' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          RUN_MODE: ${{ github.event.inputs.mode || 'full_sync' }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
          CUSTOM_CATEGORY: ${{ github.event.inputs.custom_category || 'RESMI_HABER' }}
        run: |
          echo "=== Çalışma Modu: $RUN_MODE ==="
          if [ "$RUN_MODE" = "full_sync" ]; then
            python scrapers/official_news.py || true
            python scrapers/manager.py || true
            python scripts/export_website_data.py || true
            python modules/editorial_pipeline.py || true
            python scripts/ssg_builder.py || true
            python modules/patron_ai_briefing.py || true
            python modules/agent_telemetry.py || true
          elif [ "$RUN_MODE" = "editorial_only" ]; then
            python modules/editorial_pipeline.py || true
            python scripts/ssg_builder.py || true
            python modules/agent_telemetry.py || true
          elif [ "$RUN_MODE" = "rebuild_covers" ]; then
            python modules/editorial_pipeline.py --repair-existing --rebuild-covers || true
            python scripts/ssg_builder.py --rebuild-covers || true
            python modules/agent_telemetry.py || true
          elif [ "$RUN_MODE" = "custom_article" ]; then
            if [ -n "$CUSTOM_TOPIC" ]; then
              python modules/editorial_pipeline.py --custom-topic "$CUSTOM_TOPIC" --custom-category "$CUSTOM_CATEGORY" || true
              python scripts/ssg_builder.py || true
            fi
            python modules/agent_telemetry.py || true
          elif [ "$RUN_MODE" = "briefing_only" ]; then
            python modules/patron_ai_briefing.py || true
            python modules/agent_telemetry.py || true
          fi

      - name: Değişiklikleri GitHub Pages & Repoya Pushla
        run: |
          git config --global user.name "KamuBot AutoSync"
          git config --global user.email "bot@kamupersonelrehberi.com"
          git add website/ docs/ data/
          if git diff --staged --quiet; then
            echo "Yeni değişiklik bulunamadı."
          else
            git commit -m "bot: otonom ajan calismasi (${{ github.event.inputs.mode || 'full_sync' }}) [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
